include:
  - ./docker-compose.metrics.yml

services:
  db0:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 6000:5432
    volumes:
      - shard_0:/var/lib/postgresql/data
  db1:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 6001:5432
    volumes:
      - shard_1:/var/lib/postgresql/data
  db2:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 6002:5432
    volumes:
      - shard_2:/var/lib/postgresql/data

  pgdog:
    image: ghcr.io/pgdogdev/pgdog:main
    depends_on:
      - db0
      - db1
      - db2
    volumes:
      - ./pgdog.toml:/pgdog/pgdog.toml
      - ./users.toml:/pgdog/users.toml
    ports:
      - 6432:6432

  synthetic:
    build: ./synthetic
    depends_on:
      - pgdog
    environment:
      PG_URL: postgres://postgres:postgres@pgdog:6432/postgres
      CONCURRENCY: "10"
      LOCK_RATE: "0.05"
      TX_RATE: "0.05"
      KEY_SPACE: "10000"

volumes:
  shard_0:
  shard_1:
  shard_2:
