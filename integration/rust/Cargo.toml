[package]
name = "integration_tests_rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
test = true

[dependencies]
tokio-postgres = {version = "0.7.13", features = ["with-uuid-1"]}
native-tls = "0.2"
sqlx = { version = "0.9.1", default-features = false, features = ["derive", "postgres", "runtime-tokio", "tls-native-tls", "bigdecimal", "chrono", "json", "rust_decimal", "uuid"]}
tokio.workspace = true
futures-util.workspace = true
uuid.workspace = true
chrono = "0.4"
parking_lot.workspace = true
serde_json.workspace = true
libc = "0.2"
bytes.workspace = true
rust_decimal = { version = "1.42.0", features = ["macros"] }

[dev-dependencies]
postgres-native-tls = "0.5"
serial_test = "4"
reqwest.workspace = true
rand.workspace = true
chrono-tz = "0.10.4"
pgdog-stats = { path = "../../pgdog-stats" }
pg_stream = "0.2.1"
pgdog-regress = { git = "https://github.com/pgdogdev/regress.git", rev = "22032787eeaef9bf97aaa3216735a7369f1f9125" }
anyhow = "1.0.104"
tokio-rustls = "0.26"
