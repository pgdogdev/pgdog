name: ci
on:
  push:
    branches:
      - main-ent
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      # Compute the binary key before restoring rust-cache: rust-cache restores
      # target/ build outputs that would otherwise change the key. Use the
      # split cache actions so pgdog binaries are saved immediately after the
      # build, before rust-cache's post-job cleanup prunes workspace binaries
      # from target/.
      - name: Compute cache key
        id: cache-key
        run: echo "key=pgdog-bin-${{ runner.os }}-coverage-v2-$(bash integration/ci/cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Restore pgdog binary
        id: pgdog-bin
        uses: actions/cache/restore@v5
        with:
          path: target/llvm-cov-target/debug/pgdog
          key: ${{ steps.cache-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.pgdog-bin.outputs.cache-hit != 'true'
        with:
          prefix-key: build-cov-debug-v2
          shared-key: build
      - name: Build (instrumented debug, for coverage)
        if: steps.pgdog-bin.outputs.cache-hit != 'true'
        run: bash integration/ci/prepare-instrumented-pgdog.sh debug
      - name: Save pgdog binary
        if: steps.pgdog-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/llvm-cov-target/debug/pgdog
          key: ${{ steps.cache-key.outputs.key }}

  ci:
    runs-on: ${{ matrix.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: [build]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: ${{ matrix.needs_docker && '--privileged' || '' }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: pgbench,
              script: integration/pgbench/run.sh,
              runner: blacksmith-8vcpu-ubuntu-2404,
            }
          - { name: schema-sync, script: integration/schema_sync/run.sh }
          - { name: go, script: integration/go/run.sh }
          - { name: js, script: integration/js/pg_tests/run.sh }
          - { name: ruby, script: integration/ruby/run.sh, needs_gems: true }
          - { name: java, script: integration/java/run.sh }
          - { name: elixir, script: integration/elixir/run.sh }
          - {
              name: haskell,
              script: integration/haskell/run.sh,
              needs_haskell: true,
            }
          - { name: mirror, script: integration/mirror/run.sh }
          - { name: sql, script: integration/sql/run.sh }
          - { name: toxi, script: integration/toxi/run.sh, needs_gems: true }
          - {
              name: rust-1,
              script: integration/rust/run.sh,
              shard: 1/3,
              needs_rust_cache: true,
            }
          - {
              name: rust-2,
              script: integration/rust/run.sh,
              shard: 2/3,
              needs_rust_cache: true,
            }
          - {
              name: rust-3,
              script: integration/rust/run.sh,
              shard: 3/3,
              needs_rust_cache: true,
            }
          - { name: python, script: integration/python/run.sh }
          - { name: two-pc, script: integration/two_pc/run.sh }
          - { name: complex, script: integration/complex/run.sh }
          - { name: dry-run, script: integration/dry_run/run.sh }
          - { name: copy-data, script: integration/copy_data/run.sh }
          - {
              name: load-balancer,
              script: integration/load_balancer/run.sh,
              lb_part: rest,
              needs_rust_cache: true,
              needs_docker: true,
            }
          - {
              name: load-balancer-prepared,
              script: integration/load_balancer/run.sh,
              lb_part: prepared,
              needs_rust_cache: true,
              needs_docker: true,
              runner: blacksmith-8vcpu-ubuntu-2404,
            }
          - { name: tls, script: integration/tls/run.sh, needs_docker: true }
          - {
              name: resharding,
              script: integration/resharding/run.sh,
              needs_docker: true,
            }
          # plugins/run.sh builds 4 plugin crates with cargo, so it needs
          # the workspace target/ cache; the other entries just run the
          # cached pgdog binary.
          - {
              name: plugins,
              script: integration/plugins/run.sh,
              needs_rust_cache: true,
              continue_on_error: true,
            }
    steps:
      - uses: actions/checkout@v6
      - name: Set coverage env
        run: |
          # All suites run against the llvm-cov instrumented debug binary so we
          # get line coverage from integration tests, not just unit tests.
          echo "PGDOG_BIN=${GITHUB_WORKSPACE}/target/llvm-cov-target/debug/pgdog" >> "$GITHUB_ENV"
          # NB: cargo llvm-cov report only globs profraw files at the top of
          # target/llvm-cov-target, so LLVM_PROFILE_FILE must point there.
          echo "LLVM_PROFILE_FILE=${GITHUB_WORKSPACE}/target/llvm-cov-target/${{ matrix.name }}-%p-%m.profraw" >> "$GITHUB_ENV"
      - name: Compute cache key
        id: cache-key
        run: echo "key=pgdog-bin-${{ runner.os }}-coverage-v2-$(bash integration/ci/cache-key.sh)" >> "$GITHUB_OUTPUT"
      # rust-cache must run before the binary restore: it lays down a
      # stale target/ that can otherwise wipe target binaries when cargo
      # reconciles fingerprints during plugin builds.
      - name: Restore Rust cache for plugin builds
        if: matrix.needs_rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-v2
          shared-key: integration
      - name: Restore instrumented pgdog binary
        uses: actions/cache/restore@v5
        with:
          path: target/llvm-cov-target/debug/pgdog
          key: ${{ steps.cache-key.outputs.key }}
          fail-on-cache-miss: true
      # The Rust cache (plugins job) can lay down stale .profraw files that
      # don't match the restored instrumented binary; start clean.
      - name: Prepare coverage profile dir
        run: |
          mkdir -p target/llvm-cov-target
          rm -f target/llvm-cov-target/*.profraw target/llvm-cov-target/*.profdata
      - name: Install GHC/Cabal
        if: matrix.needs_haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.4"
          cabal-version: "3.18.1.0"
      - name: Cache Cabal dependencies
        if: matrix.needs_haskell
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ steps.setup-haskell.outputs.ghc-version }}-${{ steps.setup-haskell.outputs.cabal-version }}-${{ hashFiles('integration/haskell/*.cabal', 'integration/haskell/cabal.project', 'integration/haskell/**/*.hs') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ steps.setup-haskell.outputs.ghc-version }}-${{ steps.setup-haskell.outputs.cabal-version }}-
      - name: Start Docker
        if: matrix.needs_docker
        run: bash integration/ci/start-docker.sh
      - name: Setup dependencies
        run: bash integration/ci/setup.sh --with-toxi
      - name: Cache gems
        if: matrix.needs_gems
        uses: actions/cache@v5
        with:
          path: ~/.gem
          key: gems-${{ runner.os }}-${{ hashFiles('integration/toxi/Gemfile.lock', 'integration/ruby/Gemfile.lock') }}
      - name: Run ${{ matrix.name }}
        env:
          NEXTEST_SHARD: ${{ matrix.shard }}
          LB_PART: ${{ matrix.lb_part }}
        run: bash ${{ matrix.script }}
      - name: Ensure PgDog stopped
        if: always()
        run: bash integration/ci/ensure-pgdog-stopped.sh
      - name: Generate coverage report
        if: ${{ github.event_name != 'merge_group' }}
        run: cargo llvm-cov report --package pgdog --lcov --output-path ${{ matrix.name }}.lcov
      # Codecov merges uploads per flag server-side, so each suite uploads
      # its own lcov under the shared "integration" flag.
      - name: Upload coverage to Codecov
        if: ${{ github.event_name != 'merge_group' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ${{ matrix.name }}.lcov
          flags: integration
          name: integration-${{ matrix.name }}
          fail_ci_if_error: false
  success:
    name: All Integration Tests Passed
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - run: echo Done!
