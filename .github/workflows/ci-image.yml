# Instead of running downloads in every single one of our 30 jobs, this builds an image
# we can re-use across all of our jobs, saving us roughly 60 secs end-to-end (and 10-15 mins of runner mins in aggregate)

name: ci-image
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the tag if it already exists
        type: boolean
        default: false
  push:
    branches:
      - main
      - main-ent
    paths:
      - ".github/workflows/**"
      - "docker/Dockerfile.ci"
      - "integration/ci/install-deps.sh"
      - "rust-toolchain.toml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/**"
      - "docker/Dockerfile.ci"
      - "integration/ci/install-deps.sh"
      - "rust-toolchain.toml"

env:
  IMAGE: ghcr.io/pgdogdev/pgdog-ci

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve tag
        id: tag
        run: |
          tags=$(grep -rhoE "${IMAGE}:[A-Za-z0-9._-]+" .github/workflows | sort -u)
          if [[ $(wc -l <<< "$tags") -ne 1 || -z "$tags" ]]; then
            echo "Expected exactly one ${IMAGE} tag across workflows, found:" >&2
            echo "$tags" >&2
            exit 1
          fi
          echo "ref=${tags}" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for existing tag
        id: existing
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.tag.outputs.ref }} already published"
          fi
      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true' || inputs.force
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        if: steps.existing.outputs.found != 'true' || inputs.force
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ci
          tags: ${{ steps.tag.outputs.ref }}
          platforms: linux/amd64
          push: true
