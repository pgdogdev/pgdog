# Handles running Bencher perf tests to detect regressions.
# Runs only when PRs are made from an internal branch (NOT A FORK) to main.
# Forks are processed via 2 steps [bencher_fork_run.yml, bencher_fork_track.yml]
# TODO: I have some big plans for this file. Please contact @jkaczman before planning to modify with new tests.

name: bencher
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  IMAGE: registry.bencher.dev/pgdog:${{ github.sha }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    strategy:
      matrix:
        include:
          - bin: pgdog
            run: |
              cargo build --release --bin pgdog --config 'target."cfg(all())".rustflags=["-C","llvm-args=-align-all-functions=6"]'
              cp target/release/pgdog out/pgdog
          - bin: pgdog-microbench
            runner: blacksmith-16vcpu-ubuntu-2404
            run: |
              bin=$(cargo test --profile microbench -p pgdog --bin pgdog --features bench --no-run --message-format=json --config 'target."cfg(all())".rustflags=["-C","llvm-args=-align-all-functions=6"]' \
                | jq -r 'select(.profile.test == true and .target.name == "pgdog") | .executable')
              cp "$bin" out/pgdog-microbench
    steps:
      - uses: actions/checkout@v6
      - name: Install CI deps
        run: bash integration/ci/install-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-v1
          key: ${{ matrix.bin }}
      - name: Build ${{ matrix.bin }}
        env:
          GIT_HASH: bench
        run: |
          mkdir out
          ${{ matrix.run }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: out/${{ matrix.bin }}
          retention-days: 1

  image:
    needs: build
    # This initial runner is to assemble the docker image for the Bencher runner. It doesn't run any tests itself.
    # Bencher's runners do not have outside network access; requires us to have everything ready-to-go.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Build image
        run: |
          chmod +x bin/*
          docker build --build-context bin=bin -f benches/perf/Dockerfile -t $IMAGE .

      - name: Push image
        run: |
          echo '${{ secrets.BENCHER_API_KEY }}' | docker login registry.bencher.dev -u pgdog --password-stdin
          docker push $IMAGE

  bench:
    needs: image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # sharding-w2 runs sharding with 2 PgDog workers, so that we can catch **contention** between
        # workers (e.g., a new lock on the hot path) through ctx-switches-per-txn.
        #
        # TODO: we need another test on a runner with more CPUs to catch contention with a larger
        # amount of workers (e.g., 4-8). 4 vCPUs can only fit 2 workers while leaving enough
        # cores for Postgres and pgbench.
        include:
          - suite: pooler
          - suite: lb
            cpu_bound: 0.015
          - suite: sharding-w2
          - suite: microbench
          # - suite: sharding-w8
    steps:
      - uses: actions/checkout@v6
      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a
      - name: Run ${{ matrix.suite }} on Bencher bare metal
        env:
          START_POINT: ${{ github.event_name == 'pull_request' && format('--start-point {0} --start-point-hash {1} --start-point-clone-thresholds --start-point-reset', github.base_ref, github.event.pull_request.base.sha) || '' }}
        # This will run one test per job (all in parallel).
        #
        # Why --github-actions? This allows it to comment on the PR with the result.
        # Why --adapter json? This allows us to use a 'custom harness'; basically nothing like rust's cargo test / criterion, we're running custom scripts
        # Why --detach & --ci-callback-token? This allows us to exit early, and defer posting a comment until repository_dispatch is fired on
        # a separate workflow (bencher_followup.yml)
        run: |
          bencher run \
            --project pgdog \
            --key '${{ secrets.BENCHER_API_KEY }}' \
            --branch '${{ github.head_ref || github.ref_name }}' \
            $START_POINT \
            --spec intel-v1 \
            --threshold-measure throughput \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary 0.01 \
            --threshold-upper-boundary _ \
            --threshold-measure cpu-per-txn \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary ${{ matrix.cpu_bound || '0.01' }} \
            --threshold-measure ctx-switches-per-txn \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.03 \
            --threshold-measure alloc_count \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0 \
            --threshold-measure alloc_bytes \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.01 \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-max-sample-size 1 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.10 \
            --thresholds-reset \
            --error-on-alert \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --ci-id ${{ matrix.suite }} \
            --ci-only-on-alert \
            --adapter json \
            --image $IMAGE \
            --detach \
            --ci-callback-token '${{ secrets.BENCHER_GITHUB_TOKEN }}' \
            "bash benches/perf/bencher.sh ${{ matrix.suite }}"
