name: tests
on:
  push:
    branches:
      - main-ent
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

jobs:
  coverage:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 1, shard: 1/3 }
          - { name: 2, shard: 2/3 }
          - { name: 3, shard: 3/3 }
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2" # Change this when updating tooling
          shared-key: coverage
      - name: Setup PostgreSQL
        run: bash integration/ci/setup.sh --with-toxi
      - name: Run tests with coverage
        env:
          RUSTFLAGS: "--cfg tokio_unstable -C link-dead-code"
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --no-report --no-fail-fast --test-threads=1 --partition count:${{ matrix.shard }} --filter-expr "package(pgdog) | package(pgdog-config) | package(pgdog-vector) | package(pgdog-stats) | package(pgdog-postgres-types)"
      - name: Generate coverage report
        if: ${{ github.event_name != 'merge_group' }}
        run: cargo llvm-cov report --lcov --output-path lcov.info
      # Requires CODECOV_TOKEN secret for upload
      - uses: codecov/codecov-action@v4
        if: ${{ github.event_name != 'merge_group' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          flags: unit
          name: coverage-${{ matrix.name }}
          fail_ci_if_error: false

  doc-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/pgdogdev/pgdog-ci:v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "unit-v2"
          shared-key: doc-tests
      - run: cargo test --doc

  tests:
    needs: [coverage, doc-tests]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - run: test "${{ needs.coverage.result }}" = "success" && test "${{ needs.doc-tests.result }}" = "success"
